<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#101319">
  <meta name="description" content="MacFit — Bodybuilding-Spiel für den Browser. Trainieren, wachsen, aufsteigen.">
  <title>MacFit</title>

  <!-- ?v= haengt an jeder Datei-URL und wird zusammen mit MacFit.version in
       js/core/namespace.js erhoeht. GitHub Pages liefert mit max-age=600:
       ohne den Zusatz zeigt das Handy nach einem Push bis zu zehn Minuten
       alte Skripte, obwohl das HTML schon frisch ist. -->
  <link rel="stylesheet" href="css/base.css?v=1.20.0">
  <link rel="stylesheet" href="css/layout.css?v=1.20.0">
  <link rel="stylesheet" href="css/components.css?v=1.20.0">
</head>
<body>

  <div id="app">
    <header id="hud"></header>

    <main id="screens">
      <section id="screen-gym" class="screen screen--gym"></section>
      <section id="screen-session" class="screen screen--session"></section>
      <section id="screen-contest" class="screen"></section>
      <section id="screen-shop" class="screen"></section>
      <section id="screen-stats" class="screen"></section>
    </main>

    <nav id="tabbar">
      <button type="button" data-tab="gym"><span>🏋️</span>Gym</button>
      <button type="button" data-tab="shop"><span>🧪</span>Shop</button>
      <button type="button" data-tab="stats"><span>📊</span>Körper</button>
    </nav>
  </div>

  <div id="toasts"></div>
  <div id="modal-root"></div>
  <div id="gate-root"></div>
  <div id="intro-root"></div>

  <!-- Reihenfolge zaehlt: vendor -> core -> data -> game -> ui -> main.
       js/vendor/supabase.js ist die einzige Fremdbibliothek (Konto und
       Cloud-Spielstand) und kommt vor allem eigenen Code. -->
